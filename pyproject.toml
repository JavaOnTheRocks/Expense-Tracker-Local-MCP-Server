[project]
name = "expense-tracker-mcp-server"
version = "0.1.0"
description = "Expense Tracker MCP Server"
readme = "README.md"
authors = [
    { name = "RockyBhai", email = "rbisnnoii@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=4.0.5",
]

[project.scripts]
remote-mcp-server = "remote_mcp_server.main:main"

[tool.uv.build-backend]
module-name = "remote_mcp_server"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
